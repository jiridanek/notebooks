---
name: Code Coverage

"on":
  push:
    branches: [main, test/code-coverage-workflow] # test branch added to fire on fork push
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  coverage:
    permissions:
      contents: read
      # code-quality: write is required to upload to GitHub's code coverage API.
      code-quality: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.x"

      # Self-contained coverage so the run doesn't depend on the whole repo's suite.
      # Produces a valid Cobertura ./coverage.xml to exercise the upload action.
      - name: Generate coverage report
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Run in $RUNNER_TEMP so pytest doesn't pick up the repo's pytest.ini.
          work="$RUNNER_TEMP/covdemo"
          mkdir -p "$work"
          cat > "$work/test_sample.py" <<'PY'
          def add(a, b):
              return a + b


          def test_add():
              assert add(1, 2) == 3
          PY
          cd "$work"
          python -m pytest -p no:cacheprovider --cov=test_sample --cov-report=xml
          cp coverage.xml "$GITHUB_WORKSPACE/coverage.xml"
          echo "--- coverage.xml head ---"; head -5 "$GITHUB_WORKSPACE/coverage.xml"

      - name: Upload coverage report
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1  # v1.4.1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest
